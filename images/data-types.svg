@startuml


skinparam Dpi 150
skinparam Monochrome false
skinparam LineType ortho
hide circle
skinparam Default {
  TextAlignment center
  FontName Helvetica
}
skinparam Class {
  AttributeIconSize 0
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  StereotypeFontSize 10
}
skinparam Rectangle {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}
skinparam Object {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}

skinparam Entity {
  StereotypeFontSize 10
}





rectangle NaturalNumber <<primitiveType>> {
}
rectangle String <<primitiveType>> {
}
rectangle Iso639Code <<dataType>> {
}
rectangle Iso15924Code <<dataType>> {
}
rectangle Iso24229Code <<dataType>> {
}
rectangle Uri <<dataType>> {
}

class NameString {
  +text: String
}

NaturalNumber -[hidden]- String
Iso639Code    -[hidden]- String
Iso639Code    -[hidden]- Iso15924Code

Iso24229Code  -[hidden]- Uri
NameString    -[hidden]- Uri

@enduml

