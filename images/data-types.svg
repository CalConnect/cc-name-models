F" filter="url(#f1gctaeu250smv)" height="82.4585" id="NameString" style="stroke: #000000; stroke-width: 2.34375;" width="139.0625" x="1292.9688" y="12.5"/><text fill="#000000" font-family="Helvetica" font-size="18.75" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="129.6875" x="1297.6563" y="37.7167">NameString</text><line style="stroke: #000000; stroke-width: 2.34375;" x1="1294.5313" x2="1430.4688" y1="49.9512" y2="49.9512"/><text fill="#000000" font-family="Helvetica" font-size="17.1875" lengthAdjust="spacingAndGlyphs" textLength="112.5" x="1302.3438" y="72.155">+text: String</text><line style="stroke: #000000; stroke-width: 2.34375;" x1="1294.5313" x2="1430.4688" y1="82.4585" y2="82.4585"/><!--
@startuml


skinparam Dpi 150
skinparam Monochrome false
skinparam LineType ortho
hide circle
skinparam Default {
  TextAlignment center
  FontName Helvetica
}
skinparam Class {
  AttributeIconSize 0
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  StereotypeFontSize 10
}
skinparam Rectangle {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}
skinparam Object {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}

skinparam Entity {
  StereotypeFontSize 10
}





rectangle NaturalNumber <<primitiveType>> {
}
rectangle String <<primitiveType>> {
}
rectangle Iso639Code <<dataType>> {
}
rectangle Iso15924Code <<dataType>> {
}
rectangle Iso24229Code <<dataType>> {
}
rectangle Uri <<dataType>> {
}

class NameString {
  +text: String
}

@enduml

