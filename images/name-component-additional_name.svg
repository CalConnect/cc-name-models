@startuml


skinparam Dpi 150
skinparam Monochrome false
skinparam LineType ortho
hide circle
skinparam Default {
  TextAlignment center
  FontName Helvetica
}
skinparam Class {
  AttributeIconSize 0
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  StereotypeFontSize 10
}
skinparam Rectangle {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}
skinparam Object {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}

skinparam Entity {
  StereotypeFontSize 10
}



class NameComponent {
}

class AdditionalName {
  +type: AdditionalNameType[0..*]
}

NameComponent <|- - AdditionalName
AdditionalName  - - AdditionalNameType

enum AdditionalNameType <<enumeration>> {
}

@enduml

