@startuml


skinparam Dpi 150
skinparam Monochrome false
skinparam LineType ortho
hide circle
skinparam Default {
  TextAlignment center
  FontName Helvetica
}
skinparam Class {
  AttributeIconSize 0
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  StereotypeFontSize 10
}
skinparam Rectangle {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}
skinparam Object {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}

skinparam Entity {
  StereotypeFontSize 10
}



object York
object duchessOfYork {
  "Duchess of York"
}

object Duchess {
  regime = "GBR"
}

class Style {
  regime
}

NameComponent <|- - Honorific
Place         <..  York          : <<instanceOf>>
HonorificType <|- - Style
Style         <..  Duchess       : <<instanceOf>>
Duchess       - -   duchessOfYork
York          - -   duchessOfYork
Honorific     <..  duchessOfYork : <<instanceOf>>

@enduml

