82bf491c9eb383e4]
@startuml


skinparam Dpi 150
skinparam Monochrome false
skinparam LineType ortho
hide circle
skinparam Default {
  TextAlignment center
  FontName Helvetica
}
skinparam Class {
  AttributeIconSize 0
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  StereotypeFontSize 10
}
skinparam Rectangle {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}
skinparam Object {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}

skinparam Entity {
  StereotypeFontSize 10
}



class NameComponent {
  +componentId: Uri
  +body: NameString
  +examples: NameString[0..*]
  +abbreviation: NameString[0..*]
  +initials: NameString[0..*]
  +script: Iso15924Code
  +transcription: Iso24229Code
  +language: Iso639Code
}

@enduml

