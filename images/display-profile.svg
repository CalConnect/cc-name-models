ference to PersonalName--><path d="M1001.5625,479.2516 C1001.5625,516.275 1001.5625,569.5244 1001.5625,603.0164 " fill="none" id="DisplayProfilePreference-PersonalName" style="stroke: #000000; stroke-width: 1.5625;"/><!--link DisplayProfilePreference to CulturalProfile--><path d="M887.8906,478.9625 C887.8906,525.2516 887.8906,593.75 887.8906,593.75 C887.8906,593.75 868.9672,593.75 841.6922,593.75 " fill="none" id="DisplayProfilePreference-CulturalProfile" style="stroke: #000000; stroke-width: 1.5625;"/><!--link NameDisplayProfile to CulturalProfile--><path d="M626.9531,489.2266 C626.9531,517.9359 626.9531,553.5467 626.9531,582.3103 " fill="none" id="NameDisplayProfile-CulturalProfile" style="stroke: #000000; stroke-width: 1.5625;"/><!--
@startuml


skinparam Dpi 150
skinparam Monochrome false
skinparam LineType ortho
hide circle
skinparam Default {
  TextAlignment center
  FontName Helvetica
}
skinparam Class {
  AttributeIconSize 0
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  StereotypeFontSize 10
}
skinparam Rectangle {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}
skinparam Object {
  BackgroundColor White
  ArrowColor Black
  BorderColor Black
  FontStyle bold
  FontSize 11
  StereotypeFontSize 10
}

skinparam Entity {
  StereotypeFontSize 10
}



interface TemplateFragment {
  +toString(): String
  +component: NameComponent[1..*]
}
note left of TemplateFragment: name components

TemplateFragment - - NameTemplate

class NameTemplate {
  +fragments: TemplateFragment[1..*]
}

class DisplayCriterion {
  +predicate: Predicate
}

class NameDisplayProfile {
  +displayTemplate: NameTemplate
  +displayCriteria: DisplayCriterion[1..*]
}

DisplayCriterion - - NameDisplayProfile
NameTemplate - - NameDisplayProfile

class DisplayProfilePreference {
  +culturalProfiles: Uri[0..*]
}

class CulturalProfile {
  +profileId: Uri
  +displayProfiles: NameDisplayProfile[1..*]
}

DisplayProfilePreference - - PersonalName
DisplayProfilePreference - - CulturalProfile
NameDisplayProfile - - CulturalProfile

@enduml

